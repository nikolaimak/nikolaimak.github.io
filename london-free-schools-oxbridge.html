<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>London Free Schools — Oxbridge Top 80</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        #map { width: 100%; height: 100vh; }
        .legend {
            background: white;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            font-size: 13px;
            line-height: 1.8;
        }
        .legend h4 {
            margin-bottom: 6px;
            font-size: 14px;
            color: #333;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .legend-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid rgba(0,0,0,0.3);
            flex-shrink: 0;
        }
        .dot-grammar { background: #2ecc40; }
        .dot-state { background: #0074d9; }
        .dot-partial { background: #ff851b; }
        .popup-content h3 {
            font-size: 14px;
            margin-bottom: 4px;
            color: #222;
        }
        .popup-content p {
            font-size: 12px;
            margin: 2px 0;
            color: #555;
        }
        .popup-content .rank {
            font-weight: 600;
            color: #333;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        const map = L.map('map').setView([51.51, -0.12], 11);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 18
        }).addTo(map);

        // Custom coloured circle markers
        function createMarker(lat, lng, color, school) {
            const marker = L.circleMarker([lat, lng], {
                radius: 10,
                fillColor: color,
                color: '#333',
                weight: 2,
                opacity: 0.9,
                fillOpacity: 0.85
            }).addTo(map);

            marker.bindPopup(`
                <div class="popup-content">
                    <h3>${school.name}</h3>
                    <p><strong>Type:</strong> ${school.type}</p>
                    <p class="rank">Rank #${school.rank} — ${school.offers} Oxbridge offers (${school.pct})</p>
                    <p><strong>Area:</strong> ${school.area}</p>
                </div>
            `);

            return marker;
        }

        const colors = {
            grammar: '#2ecc40',
            state: '#0074d9',
            partial: '#ff851b'
        };

        const schools = [
            {
                name: "Queen Elizabeth's School, Barnet",
                type: "Grammar",
                rank: 9, offers: 47, pct: "44%",
                area: "Barnet",
                lat: 51.6525, lng: -0.1985,
                color: colors.grammar
            },
            {
                name: "St Olave's and St Saviour's Grammar School",
                type: "Grammar",
                rank: 15, offers: 39, pct: "35%",
                area: "Orpington",
                lat: 51.3764, lng: 0.0471,
                color: colors.grammar
            },
            {
                name: "Tiffin School",
                type: "Grammar",
                rank: 16, offers: 38, pct: "32%",
                area: "Kingston upon Thames",
                lat: 51.4128, lng: -0.3007,
                color: colors.grammar
            },
            {
                name: "Henrietta Barnett School",
                type: "Grammar",
                rank: 18, offers: 34, pct: "43%",
                area: "Hampstead Garden Suburb",
                lat: 51.5792, lng: -0.1870,
                color: colors.grammar
            },
            {
                name: "Camden School for Girls",
                type: "State",
                rank: 20, offers: 31, pct: "41%",
                area: "Camden",
                lat: 51.5559, lng: -0.1427,
                color: colors.state
            },
            {
                name: "Wilson's School",
                type: "Grammar",
                rank: 23, offers: 29, pct: "31%",
                area: "Wallington, Sutton",
                lat: 51.3580, lng: -0.1540,
                color: colors.grammar
            },
            {
                name: "The Tiffin Girls' School",
                type: "Grammar",
                rank: 48, offers: 21, pct: "31%",
                area: "Kingston upon Thames",
                lat: 51.4103, lng: -0.2985,
                color: colors.grammar
            },
            {
                name: "Dame Alice Owen's School",
                type: "Partially-selective",
                rank: 49, offers: 21, pct: "26%",
                area: "Potters Bar, Hertfordshire",
                lat: 51.6940, lng: -0.1720,
                color: colors.partial
            },
            {
                name: "Mossbourne Community Academy",
                type: "State",
                rank: 52, offers: 20, pct: "43%",
                area: "Hackney",
                lat: 51.5494, lng: -0.0558,
                color: colors.state
            },
            {
                name: "The Latymer School",
                type: "Grammar",
                rank: 54, offers: 20, pct: "27%",
                area: "Edmonton",
                lat: 51.6170, lng: -0.0600,
                color: colors.grammar
            },
            {
                name: "St Michael's Catholic Grammar School",
                type: "Grammar",
                rank: 73, offers: 14, pct: "34%",
                area: "Finchley",
                lat: 51.6130, lng: -0.1760,
                color: colors.grammar
            },
            {
                name: "The London Oratory School",
                type: "State",
                rank: 74, offers: 14, pct: "30%",
                area: "Fulham",
                lat: 51.4830, lng: -0.1930,
                color: colors.state
            },
            {
                name: "Twyford Church of England High School",
                type: "State",
                rank: 74, offers: 14, pct: "30%",
                area: "Acton",
                lat: 51.5130, lng: -0.2680,
                color: colors.state
            },
            {
                name: "Sutton Grammar School",
                type: "Grammar",
                rank: 78, offers: 14, pct: "26%",
                area: "Sutton",
                lat: 51.3610, lng: -0.1910,
                color: colors.grammar
            }
        ];

        // Add markers
        schools.forEach(school => {
            createMarker(school.lat, school.lng, school.color, school);
        });

        // Legend
        const legend = L.control({ position: 'bottomright' });
        legend.onAdd = function() {
            const div = L.DomUtil.create('div', 'legend');
            div.innerHTML = `
                <h4>London Free Schools — Oxbridge Top 80</h4>
                <div class="legend-item">
                    <span class="legend-dot dot-grammar"></span>
                    <span>Grammar (9 schools)</span>
                </div>
                <div class="legend-item">
                    <span class="legend-dot dot-state"></span>
                    <span>State (4 schools)</span>
                </div>
                <div class="legend-item">
                    <span class="legend-dot dot-partial"></span>
                    <span>Partially-selective (1 school)</span>
                </div>
                <p style="margin-top:8px; font-size:11px; color:#888;">Click markers for details</p>
            `;
            return div;
        };
        legend.addTo(map);
    </script>
</body>
</html>
